/* giving the treatment: the instrument follows your hand, tap the right place */
function doCare(i,ck){
  const h=H(i), c=CARE.find(x=>x.k===ck), B=BUILDS[h.build||'horse'];
  const spots=(c.spot==='feet'?B.spots.feet:[B.spots[c.spot]]).map(s=>({x:s[0],y:s[1],done:0}));
  let left=spots.length, busy=false;
  openSheet(`${c.name} &mdash; ${h.name}`,`
    <p class="muted" style="margin-top:0">${c.tip}</p>
    <div class="stage" id="cr-stage" style="cursor:none;touch-action:manipulation;
         background:linear-gradient(180deg,#6d4a2c 0 56%,#e8cf8e 56%)">
      <svg viewBox="0 0 260 200" style="max-width:560px;margin:0 auto;display:block" id="cr-svg">
        ${horseInner(h,'stand')}
        <g id="cr-spots">${spots.map((s,k)=>`<g class="tapspot" data-s="${k}">
          <circle cx="${s.x}" cy="${s.y}" r="14" fill="#c69a4c" opacity=".38"/>
          <circle cx="${s.x}" cy="${s.y}" r="7.5" fill="#a8503c"/>
          <circle cx="${s.x}" cy="${s.y}" r="3" fill="#fff" opacity=".85"/></g>`).join('')}</g>
        <g id="cr-done"></g>
        <g id="cr-tool" transform="translate(210,180) rotate(-18)" pointer-events="none">${careTool(ck)}</g>
      </svg></div>
    <p class="muted center" style="margin-top:9px" id="cr-tip">
      Tap the ${c.where}. <b id="cr-n">${left}</b> to go.</p>`,true);

  const stage=$('#cr-stage'), svg=$('#cr-svg'), tool=$('#cr-tool'), doneG=$('#cr-done');
  const P=e=>{const r=svg.getBoundingClientRect();
    return{x:(e.clientX-r.left)/r.width*260,y:(e.clientY-r.top)/r.height*200};};
  const put=(x,y)=>tool.setAttribute('transform',`translate(${x+30},${y}) rotate(-18)`);

  stage.addEventListener('pointermove',e=>{if(!busy){const p=P(e);put(p.x,p.y);}});
  stage.addEventListener('pointerdown',e=>{
    e.preventDefault(); if(busy)return;
    const p=P(e);
    let best=-1,bd=30;
    spots.forEach((s,k)=>{if(s.done)return;const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<bd){bd=d;best=k;}});
    if(best<0){put(p.x,p.y);return;}
    const s=spots[best]; busy=true;
    const t0=performance.now();
    (function push(){
      const k=(performance.now()-t0)/420;
      if(k>=1){
        s.done=1; left--; busy=false;
        const g=svg.querySelector(`.tapspot[data-s="${best}"]`); if(g)g.style.opacity=0;
        doneG.insertAdjacentHTML('beforeend',careMark(ck,s.x,s.y));
        const n=$('#cr-n'); if(n)n.textContent=left;
        if(left<=0){
          h.care=h.care||{}; h.care[c.k]=S.day; h.happy=clamp(h.happy+4);
          award(6,c.name.replace('&amp;','&')+' done');
          setTimeout(()=>{closeSheetSilent();checkup(i);},520);
        }
        return;
      }
      const d=Math.sin(Math.PI*k)*10;      // press in and back out
      tool.setAttribute('transform',`translate(${s.x+30-d},${s.y}) rotate(-18)`);
      const fl=document.getElementById('cr-fluid');
      if(fl)fl.setAttribute('width',String(16*(1-0.85*Math.min(1,k*1.2))));
      requestAnimationFrame(push);
    })();
  });
  stage.addEventListener('pointerleave',()=>{if(!busy)put(215,182);});
}

/* ============================ SAVING ============================ */
const SAVE_KEY='bramblewood-yard-v1';
let saveOn=false, saveTimer=null;
function canSave(){return !!(window.storage&&window.storage.set&&window.storage.get);}
async function saveGame(){
  if(!saveOn)return;
  try{
    // photos are the person's own uploads and can be huge - keep them out of the save
    const horses=S.horses.map(h=>{const c={...h};delete c.photo;return c;});
    await window.storage.set(SAVE_KEY,JSON.stringify({v:1,day:S.day,tod:S.tod,
      points:S.points,jobs:S.jobs,horses,levels:S.levels,gifts:S.gifts,yard:S.yard||1}));
  }catch(e){}
}
function markDirty(){if(!saveOn)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveGame,700);}
async function loadGame(){
  if(!canSave())return false;
  saveOn=true;
  try{
    const r=await window.storage.get(SAVE_KEY);
    if(!r||!r.value)return false;
    const d=JSON.parse(r.value);
    if(!d||d.v!==1||!Array.isArray(d.horses)||!d.horses.length)return false;
    S.day=d.day||1; S.tod=d.tod||0; S.points=d.points||0; S.jobs=d.jobs||0;
    S.horses=d.horses;
    S.horses.forEach(h=>{if(!h.care)h.care={};});
    if(Array.isArray(d.levels)&&d.levels.length===LEVELS.length)S.levels=d.levels;
    S.gifts=d.gifts||{};
    S.yard=d.yard||1;
    return true;
  }catch(e){return false;}
}
function resetYard(){
  const next=(S.yard||1)+1;
  openSheet('Start a brand new yard?',`
    <p class="muted" style="margin-top:0">You would begin again as <b>Yard ${next}</b> with Lemon, Oakley and Rollo,
      just as you started the first time.</p>
    <div class="note" style="text-align:left">
      <b>What changes on Yard ${next}:</b><br>
      &bull; Training is faster and the timing windows are tighter<br>
      &bull; Dressage tests are longer to learn by heart<br>
      &bull; The vet only gets <b>${Math.max(3,7-(next-1))} examinations</b> instead of seven<br>
      &bull; Running the yard and being a horse stay exactly the same
    </div>
    <div class="note" style="text-align:left;border-color:var(--rug);background:#f6ddd6">
      Every horse you have made and every level you have passed will be lost.
    </div>
    <div class="row" style="margin-top:14px;justify-content:center">
      <button class="btn" onclick="closeSheet()">No, keep this yard</button>
      <button class="btn btn-red btn-lg" id="rs-go">Yes, start Yard ${next}</button></div>`);
  $('#rs-go').onclick=doReset;
}
async function doReset(){
  const next=(S.yard||1)+1;
  try{if(canSave())await window.storage.delete(SAVE_KEY);}catch(e){}
  S.day=1;S.tod=0;S.points=0;S.jobs=0;S.sel=0;S.view='stables';S.mode='owner';
  S.horses=freshHorses();
  S.levels=LEVELS.map(()=>0);S.gifts={};S.yard=next;
  vetCase=null;
  closeSheetSilent();syncRoles();render();saveGame();
  toast('Yard '+next+' — the work gets harder from here');
}
window.doReset=doReset;
window.resetYard=resetYard;

/* ============================ BOOT ============================ */
function syncRoles(){$$('#roles .role').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));}
$$('#roles .role').forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode;syncRoles();closeSheetSilent();render();
  if(S.mode==='vet')say('Bag, thermometer, stethoscope. Take your time over the examination.');
  if(S.mode==='horse')say('Out to the field. Eat, drink, and have a good gallop.');
});
function closeSheetSilent(){$('#modal-root').innerHTML='';}
window.closeSheet=closeSheet;
(async()=>{
  const restored=await loadGame();
  paintTally();
  render();
  if(restored)toast('Your yard is just as you left it');
  else if(!canSave())setTimeout(()=>toast('Heads up: this copy cannot save your yard'),1200);
})();
</script>
