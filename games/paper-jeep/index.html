<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paper Jeep</title>
<style>
  :root{
    --paper:#f0e9d6;
    --ink:#2b2723;
    --rule:#7d97b8;
    --olive:#6e7f4e;
    --rust:#b34a32;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--paper);}
  body{
    font-family:"Bradley Hand","Segoe Print","Chalkboard SE","Comic Sans MS",cursive;
    color:var(--ink);
    user-select:none;
  }
  canvas{display:block;position:absolute;inset:0;outline:none;}

  #focusnag{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-2deg);
    z-index:8;font-size:24px;padding:14px 28px;pointer-events:none;
    background:rgba(240,233,214,.92);
    border:3px dashed var(--rust);color:var(--rust);
    border-radius:255px 14px 225px 15px/15px 225px 15px 255px;
    display:none;
  }
  #focusnag.show{display:block;}

  #pads{position:absolute;inset:auto 0 0 0;height:132px;z-index:4;}

  .sketchbox{
    background:rgba(240,233,214,.86);
    border:2.5px solid var(--ink);
    border-radius:255px 14px 225px 15px/15px 225px 15px 255px;
    padding:10px 16px;
    box-shadow:2px 3px 0 rgba(43,39,35,.22);
  }

  #hud{position:absolute;top:14px;left:14px;transform:rotate(-1.1deg);pointer-events:none;}
  #hud .crumb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:3px;}
  #hud .crumb a{color:var(--ink);pointer-events:auto;}
  #hud .crumb a:hover{color:var(--rust);}
  #hud .lvl{font-size:13px;letter-spacing:.06em;opacity:.65;}
  #hud .name{font-size:22px;line-height:1.1;margin-top:-2px;}
  #padG{right:18px;bottom:132px;width:66px;height:66px;font-size:24px;
    border-color:#3a5f8a;color:#3a5f8a;}
  #hud .hint{font-size:13px;opacity:.75;margin-top:3px;max-width:250px;line-height:1.25;}

  #track{position:absolute;top:16px;left:50%;transform:translateX(-50%) rotate(.6deg);pointer-events:none;}
  #trackcv{display:block;}

#topbtns{position:absolute;top:64px;right:14px;z-index:6;display:flex;
    gap:8px;flex-direction:column;align-items:flex-end;}
  .tab{font-size:14px;padding:5px 14px;transform:rotate(.8deg);}

  #sheet{position:absolute;left:50%;top:50%;z-index:9;
    transform:translate(-50%,-50%) rotate(-.7deg);
    width:min(560px,90vw);max-height:78vh;overflow:auto;display:none;
    padding:18px 22px 22px;}
  #sheet.show{display:block;}
  #sheet h2{margin:0 0 12px;font-size:26px;}
  .closeb{position:absolute;top:10px;right:12px;padding:1px 11px;font-size:19px;
    border-radius:50% 45% 55% 50%/50% 55% 45% 50%;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px;}
  .cell{border:2.5px solid var(--ink);background:var(--paper);cursor:pointer;
    border-radius:200px 12px 190px 14px/14px 190px 12px 200px;
    padding:7px 9px;text-align:left;font:inherit;font-size:13px;color:var(--ink);
    box-shadow:2px 3px 0 rgba(43,39,35,.2);}
  .cell:hover{transform:translate(1px,1px);}
  .cell .n{font-size:11px;opacity:.55;}
  .cell.locked{opacity:.4;cursor:not-allowed;border-style:dashed;box-shadow:none;}
  .cell.on{background:rgba(179,74,50,.16);border-color:var(--rust);}
  .cell.done::after{content:" \2713";color:var(--rust);}

  #unlocktoast{position:absolute;left:50%;top:22%;z-index:10;display:none;
    transform:translate(-50%,0) rotate(-2deg);font-size:19px;padding:12px 22px;
    border-color:var(--rust);color:var(--rust);text-align:center;}
  #unlocktoast.show{display:block;animation:drop .3s cubic-bezier(.2,1.5,.5,1);}

  #tries{position:absolute;top:14px;right:14px;transform:rotate(1.4deg);font-size:15px;pointer-events:none;}

  .card{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) rotate(-1.6deg);
    text-align:center;padding:22px 34px 24px;
    min-width:262px;display:none;z-index:5;

  .card.show{display:block;animation:drop .28s cubic-bezier(.2,1.5,.5,1);}
  @keyframes drop{from{transform:translate(-50%,-64%) rotate(-5deg);opacity:0}}
  .card h2{margin:0 0 4px;font-size:29px;}
  .card p{margin:0 0 14px;font-size:15px;opacity:.75;line-height:1.35;}

  button{
    font:inherit;font-size:17px;cursor:pointer;color:var(--ink);
    background:var(--paper);
    border:2.5px solid var(--ink);
    border-radius:225px 15px 255px 15px/15px 255px 15px 225px;
    padding:7px 22px;box-shadow:2px 3px 0 rgba(43,39,35,.25);

  button:hover{transform:translate(1px,1px);box-shadow:1px 2px 0 rgba(43,39,35,.25);}
  button:focus-visible{outline:3px dashed var(--rust);outline-offset:3px;}

  .pad{
    position:absolute;bottom:16px;width:104px;height:104px;
    border:3px solid var(--ink);border-radius:60% 40% 55% 45%/45% 55% 40% 60%;
    background:rgba(240,233,214,.55);

    cursor:pointer;

  .tiltpad{width:66px;height:66px;bottom:34px;font-size:24px;opacity:.8;}

    .tiltpad{width:54px;height:54px;bottom:40px;font-size:19px;}
    #padU{left:126px;} #padD{right:126px;}
  }

  #keys{position:absolute;bottom:12px;left:50%;transform:translateX(-50%) rotate(-.5deg);
        font-size:13px;opacity:.55;pointer-events:none;text-align:center;}

  @media (prefers-reduced-motion:reduce){ .card.show{animation:none;} }
</style>

/* ───────────────────────── sketch helpers ───────────────────────── */

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* lay down a wobbling path through the given points */
function inkPath(ctx, pts, seed, amp){
  const rnd = mulberry32(seed);
  const j = pts.map(p => ({
    x: p.x + (rnd() - .5) * amp * 2,
    y: p.y + (rnd() - .5) * amp * 2
  }));
  ctx.beginPath();
  ctx.moveTo(j[0].x, j[0].y);
  for(let i = 1; i < j.length; i++){
    const a = j[i-1], b = j[i];
    ctx.quadraticCurveTo(
      (a.x + b.x)/2 + (rnd() - .5) * amp * 2.2,
      (a.y + b.y)/2 + (rnd() - .5) * amp * 2.2,
      b.x, b.y
    );
  }
  return j;
}

/* two passes of the pen, slightly apart, so corners overshoot */
function inkStroke(ctx, pts, seed, opts){
  const o = opts || {};
  const amp = o.amp != null ? o.amp : 1.6;
  const w = o.w != null ? o.w : 2.2;
  const col = o.col || "#2b2723";
  const close = !!o.close;
  ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = col;
  ctx.globalAlpha = .55; ctx.lineWidth = w;
  inkPath(ctx, pts, seed, amp); if(close) ctx.closePath(); ctx.stroke();
  ctx.globalAlpha = .9; ctx.lineWidth = w * .8;
  inkPath(ctx, pts, seed + 977, amp * .8); if(close) ctx.closePath(); ctx.stroke();
  ctx.globalAlpha = 1;
}

/* marker wash: fill offset a touch off the outline, like colouring in a hurry */
function inkWash(ctx, pts, seed, col, alpha, dx, dy){
  ctx.save();
  ctx.translate(dx || 0, dy || 0);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  inkPath(ctx, pts, seed + 5150, 2.6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function circlePts(cx, cy, r, n){
  const pts = [];
  for(let i = 0; i <= n; i++){
    const a = i / n * Math.PI * 2;
    pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }
  return pts;
}

/* break long runs into shorter hops so the wobble reads along their length */
function subdivide(pts, maxLen){
  const out = [pts[0]];
  for(let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    const n = Math.max(1, Math.ceil(d / maxLen));
    for(let k = 1; k <= n; k++)
      out.push({ x: a.x + (b.x - a.x) * k / n, y: a.y + (b.y - a.y) * k / n });
  }
  return out;
}

/* ───────────────────────── canvas ───────────────────────── */

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let CW = 0, CH = 0, DPR = 1, scale = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width = CW * DPR; cv.height = CH * DPR;
  cv.style.width = CW + "px"; cv.style.height = CH + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scale = Math.max(.5, Math.min(1, CW / 1150));
  grain = null;
}
window.addEventListener("resize", resize);

/* paper tooth, rendered once and tiled */
let grain = null;
function makeGrain(){
  const g = document.createElement("canvas");
  g.width = g.height = 140;
  const gx = g.getContext("2d");
  const img = gx.createImageData(140, 140);
  for(let i = 0; i < img.data.length; i += 4){
    const v = Math.random();
    img.data[i] = 60; img.data[i+1] = 52; img.data[i+2] = 40;
    img.data[i+3] = v > .82 ? 16 : (v > .6 ? 7 : 0);
  }
  gx.putImageData(img, 0, 0);
  return ctx.createPattern(g, "repeat");
}

/* ───────────────────────── world state ───────────────────────── */

let engine, world, chassis, wheelF, wheelR, axles = [];
let strokes = [], rocks = [], blocks = [], barrels = [], boulders = [], planks = [];
let tiles = [], hammers = [], lifts = [], beams = [], walls = [];
let bridges = [], bridgeAnchors = [];
let finishX = 0, finishY = 0, startX = 120, startY = 0, deathY = 0;
let levelIdx = 0, crashes = 0, seed = 1;
let unlocked = 1;          // highest level reachable (1-based count)
let cleared = 0;           // how many distinct levels finished
let wearing = "none";      // equipped accessory id
let camX = 0, camY = 0, mode = "play", modeT = 0, frame = 0, inkPhase = 0;
let grounded = false, flipT = 0, best = 0, started = false, throttle = 0;
let gliding = false;
const keys = { left:false, right:false, up:false, down:false, glide:false };
const dust = [];

function surfaceYAt(list, x){
  for(const st of list){
    for(let i = 1; i < st.length; i++){
      const a = st[i-1], b = st[i];
      if(Math.abs(b.x - a.x) < 1) continue;
      if(x >= Math.min(a.x,b.x) && x <= Math.max(a.x,b.x))
        return a.y + (b.y - a.y) * (x - a.x) / (b.x - a.x);
    }
  }
  return 0;
}

/* Consecutive collinear points become ONE body. Every joint between two
   ground rectangles is a seam a wheel can catch on, so a long flat road built
   from six boxes is six little bumps. Merging them makes it genuinely flat. */
function mergeCollinear(pts){
  const out = [pts[0]];
  for(let i = 1; i < pts.length; i++){
    if(out.length >= 2){
      const a = out[out.length - 2], b = out[out.length - 1], c = pts[i];
      const a1 = Math.atan2(b.y - a.y, b.x - a.x);
      const a2 = Math.atan2(c.y - b.y, c.x - b.x);
      if(Math.abs(a1 - a2) < 1e-4){ out[out.length - 1] = c; continue; }
    }
    out.push(pts[i]);
  }
  return out;
}

function segmentBody(a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if(len < 2) return null;
  const ang = Math.atan2(dy, dx);
  const TH = 60;
  /* horizontal-ish pieces overlap slightly so joints don't leave a notch */
  const ext = Math.abs(Math.cos(ang)) > .35 ? 8 : 0;
  const nx = -dy / len, ny = dx / len;         // points into the ground
  return Bodies.rectangle(
    (a.x + b.x)/2 + nx * TH/2,
    (a.y + b.y)/2 + ny * TH/2,
    len + ext, TH,
    { isStatic:true, angle:ang, friction:1, frictionStatic:1.6,
      restitution:0, slop:.05, label:"ground" }
  );
}

function buildLevel(idx){
  const L = LEVELS[idx];
  seed = idx * 7919 + 13;

  engine = Engine.create();
  engine.gravity.y = 1;
  engine.positionIterations = 6;
  engine.velocityIterations = 4;
  engine.constraintIterations = 2;
  world = engine.world;

  /* terrain outline, left to right — starts behind the jeep so there's
     runway to reverse onto instead of an edge to fall off */
  strokes = [];
  let cur = [{ x:-320, y:0 }], x = 0, y = 0;
  for(const s of L.spec){
    if(s.t === 'f'){ x += s.w; cur.push({x, y}); }
    else if(s.t === 's'){ x += s.w; y -= s.r; cur.push({x, y}); }
    else if(s.t === 'g'){ strokes.push(cur); x += s.w; y += (s.drop || 0); cur = [{x, y}]; }
    else if(s.t === 'p'){
      cur.push({ x, y:y + s.d });
      x += s.w; cur.push({ x, y:y + s.d });
      cur.push({ x, y });
    }
  }
  strokes.push(cur);

  for(const st of strokes){
    const solid = mergeCollinear(st);
    for(let i = 1; i < solid.length; i++){
      const bdy = segmentBody(solid[i-1], solid[i]);
      if(bdy) Composite.add(world, bdy);
    }
  }

  /* wall at the back of the runway */
  Composite.add(world, Bodies.rectangle(-340, -100, 40, 400,
    { isStatic:true, friction:.4, label:"ground" }));

  finishX = x - 170;
  finishY = surfaceYAt(strokes, finishX);
  startY = surfaceYAt(strokes, startX);
  let lo = 0;
  for(const st of strokes) for(const p of st) lo = Math.max(lo, p.y);
  deathY = lo + 780;

  /* scenery + puzzle pieces */
  rocks = []; blocks = []; barrels = []; boulders = []; planks = [];
  tiles = []; hammers = []; lifts = []; beams = [];
  bridges = []; bridgeAnchors = [];
  for(const o of (L.objs || [])){
    const sy = (o.y !== undefined) ? o.y : surfaceYAt(strokes, o.x);

    if(o.t === 'rock'){
      const b = Bodies.circle(o.x, sy - o.r * .28, o.r,
        { isStatic:true, friction:.9, label:"rock" });
      b.drawR = o.r; rocks.push(b); Composite.add(world, b);

    } else if(o.t === 'block'){
      const b = Bodies.rectangle(o.x, sy - BLOCK_H/2 - 6, BLOCK_W, BLOCK_H,
        { density:.00014, friction:.22, frictionStatic:.28,
          frictionAir:.005, label:"block" });
      blocks.push(b); Composite.add(world, b);

    } else if(o.t === 'barrel'){
      /* light enough to send flying, heavy enough to unsettle you */
      const b = Bodies.rectangle(o.x, sy - 26, 34, 48,
        { density:.0004, friction:.4, restitution:.15,
          chamfer:{ radius:9 },
          /* everything EXCEPT the end barriers, so knocked barrels roll
             straight through them while the jeep still gets stopped */
          collisionFilter:{ mask: 0xFFFFFFFF & ~CAT_WALL },
          label:"barrel" });
      barrels.push(b); Composite.add(world, b);

    } else if(o.t === 'boulder'){
      const r = o.r || 34;
      const b = Bodies.circle(o.x, sy - r - 8, r,
        { density:.0022, friction:.5, frictionStatic:.3,
          restitution:.05, label:"boulder" });
      b.drawR = r; boulders.push(b); Composite.add(world, b);

    } else if(o.t === 'seesaw'){
      /* the wedge sits on the road and the plank balances on top of it, so
         driving on gives you a slope UP, and past the pivot it tips DOWN */
      const FULCRUM = 46;
      const len = o.len || 340;
      const p = Bodies.rectangle(o.x, sy - FULCRUM, len, 16,
        { density:.0007, friction:.95, frictionStatic:1.2, label:"plank" });
      p.drawLen = len;
      p.pivotX = o.x; p.pivotY = sy - FULCRUM; p.roadY = sy;
      Composite.add(world, p);
      /* free pivot: pinned in space, free to rotate */
      Composite.add(world, Constraint.create({
        pointA:{ x:o.x, y:sy - FULCRUM }, bodyB:p, pointB:{ x:0, y:0 },
        length:0, stiffness:1, damping:.1
      }));
      planks.push(p);

    } else if(o.t === 'crumble'){
      /* Collapsing tiles: hold briefly under load, then drop away */
      const n = o.n || 4, tw = o.tw || 90;
      for(let i = 0; i < n; i++){
        /* centre sits half a thickness BELOW the surface so the tile top is
           flush with the road — it was sitting 16px proud, so you had to
           climb onto it and the fuse lit before you got there */
        const tile = Bodies.rectangle(o.x + i * (tw + 6), sy + 8, tw, 16,
          { isStatic:true, friction:.9, label:"crumble" });
        tile.fuse = -1; tile.drawW = tw;
        tiles.push(tile); Composite.add(world, tile);
      }

    } else if(o.t === 'hammer'){
      /* Swinging hammer on a pivot — a timing obstacle */
      const len = o.len || 130;
      const head = Bodies.rectangle(o.x, sy - 160 + len, 54, 42,
        { density:.005, friction:.6, restitution:.1, label:"hammer" });
      Composite.add(world, head);
      Composite.add(world, Constraint.create({
        pointA:{ x:o.x, y:sy - 160 }, bodyB:head, pointB:{ x:0, y:0 },
        length:len, stiffness:1, damping:.002
      }));
      head.pivotX = o.x; head.pivotY = sy - 160;
      Body.setVelocity(head, { x:(o.push || 6), y:0 });
      hammers.push(head);

    } else if(o.t === 'lift'){
      /* Platform sliding on a fixed track — cross it at the right moment */
      const p = Bodies.rectangle(o.x, sy - (o.h || 90), o.w || 150, 18,
        { isStatic:true, friction:.95, label:"lift" });
      p.homeX = o.x; p.homeY = sy - (o.h || 90);
      p.ampX = o.ax || 0; p.ampY = o.ay || 70;
      p.rate = o.rate || .011; p.phase = o.phase || 0;
      p.drawW = o.w || 150;
      lifts.push(p); Composite.add(world, p);

    } else if(o.t === 'bridge'){
      /* A chain of planks anchored at both ends. It sags under the jeep and
         swings — unlike a narrow beam, which in 2D is just flat road. */
      const n = o.n || 9, span = o.w || 300, segW = span / n;
      const by = sy - 4, GRP = Body.nextGroup(true);
      let prev = null;
      for(let i = 0; i < n; i++){
        const px = o.x - span/2 + segW * (i + .5);
        const seg = Bodies.rectangle(px, by, segW * .92, 9, {
          density:.0009, friction:.95, frictionAir:.02,
          collisionFilter:{ group:GRP }, label:"bridge" });
        seg.drawW = segW * .92;
        Composite.add(world, seg);
        bridges.push(seg);
        Composite.add(world, Constraint.create(prev
          ? { bodyA:prev, pointA:{x:segW/2,y:0}, bodyB:seg, pointB:{x:-segW/2,y:0},
              length:0, stiffness:.85, damping:.1 }
          : { pointA:{x:o.x - span/2, y:by}, bodyB:seg, pointB:{x:-segW/2,y:0},
              length:0, stiffness:1 }));
        prev = seg;
      }
      Composite.add(world, Constraint.create({
        pointA:{ x:o.x + span/2, y:by }, bodyB:prev, pointB:{ x:segW/2, y:0 },
        length:0, stiffness:1 }));
      bridgeAnchors.push({ x:o.x, y:by, w:span });

    } else if(o.t === 'beam'){
      /* Narrow beam: thin, and no margin either side */
      const b = Bodies.rectangle(o.x, sy - 6, o.w || 260, 10,
        { isStatic:true, friction:.9, label:"beam" });
      b.drawW = o.w || 260;
      beams.push(b); Composite.add(world, b);
    }
  }

  /* end stops, so you can't run off either end of the paper */
  walls = [];
  const endX = x, endY = surfaceYAt(strokes, x - 4);
  for(const [wx, wy] of [[-RUNWAY + 10, surfaceYAt(strokes, -RUNWAY + 14)],
                         [endX - 8, endY]]){
    const wall = Bodies.rectangle(wx, wy - 110, 22, 220,
      { isStatic:true, friction:.4,
        collisionFilter:{ category:CAT_WALL }, label:"wall" });
    wall.topY = wy - 220; wall.baseY = wy;
    walls.push(wall); Composite.add(world, wall);
  }

  buildJeep(startX, startY - RIDE_HEIGHT);

  camX = chassis.position.x; camY = chassis.position.y - 40;
  dust.length = 0; flipT = 0; best = startX;
  mode = "play"; modeT = 0; started = false; throttle = 0;
  gliding = false;

  /* settle the suspension, then sleep the rig so it sits dead still */
  for(let i = 0; i < 45; i++) Engine.update(engine, 1000/60);
  for(const b of [chassis, wheelF, wheelR]){
    Body.setVelocity(b, { x:0, y:0 });
    Body.setAngularVelocity(b, 0);
    Matter.Sleeping.set(b, true);
  }
  camX = chassis.position.x; camY = chassis.position.y - 40;

  Events.on(engine, "beforeUpdate", () => { grounded = false; });
  const touch = ev => {
    for(const p of ev.pairs){
      if(p.bodyA === wheelF || p.bodyB === wheelF || p.bodyA === wheelR || p.bodyB === wheelR)
        grounded = true;
    }
  };
  Events.on(engine, "collisionStart", touch);
  Events.on(engine, "collisionActive", touch);

  /* Nose-first or roof-first contact ends the run. A flat belly scrape over
     a rock does not — only steep strikes count. */
  Events.on(engine, "collisionStart", ev => {
    if(mode !== "play" || !started) return;
    for(const p of ev.pairs){
      const other = p.bodyA === chassis ? p.bodyB
                  : p.bodyB === chassis ? p.bodyA : null;
      if(!other || other === wheelF || other === wheelR) continue;
      const tilt = Math.abs(Math.atan2(Math.sin(chassis.angle), Math.cos(chassis.angle)));
      if(tilt > .8){ finish("crash"); return; }
    }
  });

  syncHud();
}

/* One source of truth for jeep geometry, so the spawn positions and the
   axle anchors can never drift apart again. */
const AXLE_X = 40, AXLE_Y = 6, WHEEL_R = 26;
const RIDE_HEIGHT = AXLE_Y + WHEEL_R;   // chassis centre above the road

function buildJeep(x, y){
  /* THE BUG, present since the first version: the wheels physically overlap
     the chassis rectangle (they have to — they're mounted under it). Nothing
     stopped them colliding with each other, so every frame the solver tried
     to shove two interpenetrating bodies apart. That was the jitter, the
     bouncing and the spinning. A shared negative collision group makes the
     jeep's own parts pass through each other while still hitting the world. */
  const RIG = Body.nextGroup(true);

  chassis = Bodies.rectangle(x, y, 104, 28, {
    density:.006, friction:.4, frictionAir:.012,
    collisionFilter:{ group:RIG }, label:"chassis"
  });
  const wOpt = {
    density:.0018, friction:1, frictionStatic:1.8,
    restitution:0, slop:.05,
    collisionFilter:{ group:RIG }, label:"wheel"
  };
  wheelR = Bodies.circle(x - AXLE_X, y + AXLE_Y, WHEEL_R, wOpt);
  wheelF = Bodies.circle(x + AXLE_X, y + AXLE_Y, WHEEL_R, wOpt);

  axles = [
    Constraint.create({ bodyA:chassis, pointA:{x:-AXLE_X,y:AXLE_Y}, bodyB:wheelR,
                        stiffness:1, damping:0, length:0 }),
    Constraint.create({ bodyA:chassis, pointA:{x: AXLE_X,y:AXLE_Y}, bodyB:wheelF,
                        stiffness:1, damping:0, length:0 })
  ];
  Composite.add(world, [chassis, wheelR, wheelF].concat(axles));
}

/* ───────────────────────── driving ───────────────────────── */

const MAX_SPIN = .95;      // rad/step: ~1480 px/s at r=26
const TOP_SPEED = 24;      // px/step ceiling on the chassis
const WHEEL_TORQUE = .20;  // ~1.2g: right at the 1.25g wheelie limit

function drive(){
  const dir  = (keys.right ? 1 : 0) + (keys.left ? -1 : 0);
  const tilt = (keys.down ? 1 : 0) + (keys.up ? -1 : 0);

  /* Before the first input the jeep is genuinely asleep. Nothing is written
     to its velocities at all — every frame we touched them we were fighting
     the contact solver, and that fight is what made it hop off the line. */
  if(!started){
    if(dir !== 0 || tilt !== 0 || keys.glide){
      started = true;
      for(const b of [chassis, wheelF, wheelR]) Matter.Sleeping.set(b, false);
    } else {
      return;
    }
  }

  /* Throttle ramps in over about half a second. */
  if(dir !== 0) throttle = Math.min(1, throttle + .07);
  else          throttle = Math.max(0, throttle - .15);

  /* Drive with TORQUE, not by forcing angular velocity. Forcing it overrides
     whatever the contact solver just worked out, every single frame — that
     fight is the jitter, and it also means grip is infinite, which is why it
     took off. Torque lets friction decide how much actually reaches the road. */
  const spd = Math.hypot(chassis.velocity.x, chassis.velocity.y);

  for(const w of [wheelF, wheelR]){
    if(dir !== 0 && Math.abs(w.angularVelocity) < MAX_SPIN && spd < TOP_SPEED){
      w.torque += dir * WHEEL_TORQUE * throttle;
    }
    if(dir === 0 && Math.abs(w.angularVelocity) > .01){
      w.torque -= Math.sign(w.angularVelocity) * WHEEL_TORQUE * .7;   // brake
    }
  }

  /* Glide: hold it off a ramp and the jeep spreads a paper wing. Cancels
     most of gravity while falling, levels the body out and keeps it drifting
     forward — turns a short hop into a long, flat sail. Air only. */
  gliding = keys.glide && !grounded;
  if(gliding){
    const weight = (chassis.mass + wheelF.mass + wheelR.mass)
                 * engine.gravity.y * engine.gravity.scale;
    if(chassis.velocity.y > 0)
      Body.applyForce(chassis, chassis.position, { x:0, y:-weight * .78 });
    /* wings want to fly level */
    const a = Math.atan2(Math.sin(chassis.angle), Math.cos(chassis.angle));
    Body.setAngularVelocity(chassis, chassis.angularVelocity * .88 - a * .006);
    /* and they keep you moving forward */
    Body.applyForce(chassis, chassis.position,
      { x:Math.cos(chassis.angle) * .0006 * chassis.mass, y:0 });
  }

  /* Anti-wheelie: on the ground, with no balance input, damp out pitch spin.
     Without this the drive reaction slowly rotates the body no matter how
     gentle the power is. */
  if(grounded && tilt === 0 && Math.abs(chassis.angularVelocity) > .002)
    Body.setAngularVelocity(chassis, chassis.angularVelocity * .93);

  /* Balance pedals. Up and down are the only pitch control — the throttle no
     longer twists the body in mid-air, so the two never fight each other. */
  if(tilt !== 0)
    Body.setAngularVelocity(chassis, chassis.angularVelocity + tilt * (grounded ? .0045 : .01));

  /* Gentle self-righting in the air when you're not steering */
  if(!grounded && tilt === 0){
    const a = Math.atan2(Math.sin(chassis.angle), Math.cos(chassis.angle));
    Body.setAngularVelocity(chassis, chassis.angularVelocity - a * .003);
  }

  /* dust off the driven wheel */
  if(grounded && dir !== 0 && frame % 3 === 0){
    const w = dir > 0 ? wheelR : wheelF;
    if(Math.abs(w.angularVelocity) > .12)
      dust.push({
        x: w.position.x - dir * 16, y: w.position.y + 14,
        vx: -dir * (.6 + Math.random()), vy: -Math.random() * .7,
        r: 4 + Math.random() * 7, life: 1, seed: Math.random() * 9999 | 0
      });
  }
}

function updateObstacles(){
  /* Moving platforms ride a sine track. Setting position directly keeps them
     rock solid to stand on, unlike a driven dynamic body. */
  for(const p of lifts){
    p.phase += p.rate;
    Body.setPosition(p, {
      x: p.homeX + Math.sin(p.phase) * p.ampX,
      y: p.homeY + Math.sin(p.phase) * p.ampY
    });
  }

  /* Collapsing tiles: once a wheel rests on one it fuses, then falls away */
  for(const t of tiles){
    if(t.fuse === -1){
      const onIt = Math.abs(chassis.position.x - t.position.x) < (t.drawW || 90) * .6 &&
                   chassis.position.y < t.position.y &&
                   chassis.position.y > t.position.y - 95;
      if(onIt) t.fuse = 34;
    } else if(t.fuse > 0){
      t.fuse--;
      if(t.fuse === 0){
        Body.setStatic(t, false);
        Body.setDensity(t, .0009);
        Body.setAngularVelocity(t, (Math.random() - .5) * .06);
      }
    }
  }
}

function checkState(dt){
  if(mode !== "play") return;
  best = Math.max(best, chassis.position.x);

  /* must actually reach the flag, not just drift past its x while falling
     down a hole below it */
  const atFlagHeight = chassis.position.y < finishY + 40 &&
                       chassis.position.y > finishY - 170;
  if(chassis.position.x > finishX && atFlagHeight){ finish("won"); return; }
  if(chassis.position.y > deathY){ finish("crash"); return; }

  const upright = Math.cos(chassis.angle);
  const slow = Math.hypot(chassis.velocity.x, chassis.velocity.y) < 1.4;
  if(upright < -.25 && slow) flipT += dt; else flipT = 0;
  if(flipT > 700) finish("crash");
}

function finish(kind){
  mode = kind; modeT = 0;
  if(kind === "crash"){
    crashes++;
    document.getElementById("triesn").textContent = crashes;
    for(let i = 0; i < 16; i++)
      dust.push({
        x: chassis.position.x, y: chassis.position.y,
        vx: (Math.random()-.5)*6, vy: -Math.random()*4-.5,
        r: 5 + Math.random()*11, life: 1, seed: Math.random()*9999|0
      });
  } else {
    if(levelIdx + 1 > cleared) cleared = levelIdx + 1;
    unlocked = Math.max(unlocked, Math.min(LEVELS.length, levelIdx + 2));
    const newKit = ACCESSORIES.find(a => a.at === cleared);
    if(newKit){ wearing = newKit.id; flashUnlock(newKit); }
    const last = levelIdx === LEVELS.length - 1;
    showCard(
      last ? "All " + LEVELS.length + " cleared" : "Cleared",
      last ? "You got the jeep through every page of the notebook."
           : "Next: " + LEVELS[levelIdx + 1].name,
      last ? "Start over" : "Next level"
    );
  }
}

const sheet      = document.getElementById("sheet");
const sheetTitle = document.getElementById("sheetTitle");
const sheetBody  = document.getElementById("sheetBody");
const toast      = document.getElementById("unlocktoast");

function openSheet(kind){
  sheetTitle.textContent = kind === "levels" ? "Levels" : "Wardrobe";
  sheetBody.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "grid";

  if(kind === "levels"){
    LEVELS.forEach((L, i) => {
      const b = document.createElement("button");
      const open = i < unlocked;
      b.className = "cell" + (open ? "" : " locked") + (i < cleared ? " done" : "")
                  + (i === levelIdx ? " on" : "");
      b.innerHTML = '<div class="n">' + (i + 1) + '</div>' + (open ? L.name : "locked");
      if(open) b.onclick = () => { closeSheet(); levelIdx = i; syncHud(); buildLevel(i); };
      grid.appendChild(b);
    });
  } else {
    ACCESSORIES.forEach(a => {
      const b = document.createElement("button");
      const got = cleared >= a.at;
      b.className = "cell" + (got ? "" : " locked") + (wearing === a.id ? " on" : "");
      b.innerHTML = '<div class="n">' + (a.at ? "level " + a.at : "default") + '</div>'
                  + (got ? a.name : "locked");
      if(got) b.onclick = () => { wearing = a.id; openSheet("kit"); };
      grid.appendChild(b);
    });
  }
  sheetBody.appendChild(grid);
  sheet.classList.add("show");
}
function closeSheet(){ sheet.classList.remove("show"); }

document.getElementById("btnLevels").onclick = () => openSheet("levels");
document.getElementById("btnKit").onclick    = () => openSheet("kit");

/* ───────────────────────── rendering ───────────────────────── */

function viewRect(){
  const hw = CW / 2 / scale, hh = CH / 2 / scale;
  return { x0:camX - hw, y0:camY - hh, x1:camX + hw, y1:camY + hh };
}

function drawBackdrop(){
  ctx.fillStyle = "#f0e9d6";
  ctx.fillRect(0, 0, CW, CH);

  /* distant pencil hills, cheap parallax in screen space */
  const base = CH * .68 + camY * .12;
  ctx.save();
  ctx.globalAlpha = .3;
  for(let layer = 0; layer < 2; layer++){
    const p = .18 + layer * .14, amp = 40 + layer * 34, span = 340 + layer * 130;
    const off = -(camX * p) % span;
    const pts = [];
    for(let i = -1; i * span + off < CW + span; i++){
      const bx = i * span + off;
      pts.push({ x:bx, y:base - layer * 26 });
      pts.push({ x:bx + span * .5, y:base - layer * 26 - amp });
    }
    if(pts.length > 1)
      inkStroke(ctx, pts, 700 + layer, { amp:1.4, w:1.6, col:"#6b6255" });
  }
  ctx.restore();

  /* squared-notebook rule, in world space */
  const r = viewRect();
  ctx.save();
  ctx.translate(CW/2, CH/2); ctx.scale(scale, scale); ctx.translate(-camX, -camY);
  ctx.strokeStyle = "#7d97b8"; ctx.globalAlpha = .17; ctx.lineWidth = 1;
  ctx.beginPath();
  const G = 50;
  for(let gx = Math.floor(r.x0/G)*G; gx <= r.x1; gx += G){ ctx.moveTo(gx, r.y0); ctx.lineTo(gx, r.y1); }
  for(let gy = Math.floor(r.y0/G)*G; gy <= r.y1; gy += G){ ctx.moveTo(r.x0, gy); ctx.lineTo(r.x1, gy); }
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawGround(){
  const r = viewRect();
  const bottom = deathY + 400;

  strokes.forEach((st, si) => {
    if(st[st.length-1].x < r.x0 - 60 || st[0].x > r.x1 + 60) return;

    const fine = subdivide(st, 46);
    const poly = fine.concat([
      { x:fine[fine.length-1].x, y:bottom },
      { x:fine[0].x, y:bottom }
    ]);

    /* hatched soil, clipped to the ground silhouette */
    ctx.save();
    inkPath(ctx, poly, seed + si * 31, 1.5);
    ctx.closePath();
    ctx.clip();

    ctx.fillStyle = "#e4dcc4"; ctx.globalAlpha = .85;
    ctx.fillRect(r.x0 - 40, r.y0 - 40, (r.x1-r.x0) + 80, (r.y1-r.y0) + 80);
    ctx.globalAlpha = 1;

    ctx.strokeStyle = "#8d8168"; ctx.globalAlpha = .4; ctx.lineWidth = 1.3;
    ctx.beginPath();
    const step = 15;
    const c0 = Math.floor((r.x0 - r.y1) / step) * step;
    const c1 = Math.ceil((r.x1 - r.y0) / step) * step;
    for(let c = c0; c <= c1; c += step){
      ctx.moveTo(r.y0 + c, r.y0);
      ctx.lineTo(r.y1 + c, r.y1);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    /* the surface line itself, culled to what's on screen */
    const vis = fine.filter((p, i) =>
      p.x > r.x0 - 90 && p.x < r.x1 + 90 ||
      (fine[i-1] && fine[i-1].x < r.x1 && fine[i+1] && fine[i+1].x > r.x0));
    if(vis.length > 1)
      inkStroke(ctx, vis, seed + si * 31 + 5, { amp:1.5, w:3 });
  });
}

}

function drawPlanks(ph){
  for(const p of planks){
    /* fulcrum wedge, drawn in world space under the pivot */
    const wedge = [
      { x:p.pivotX - 30, y:p.roadY },
      { x:p.pivotX,      y:p.pivotY + 2 },
      { x:p.pivotX + 30, y:p.roadY },

    ];
    inkWash(ctx, wedge, 209, "#8a7a60", .5, 2, 2);

    ctx.save();
    ctx.translate(p.position.x, p.position.y);
    ctx.rotate(p.angle);
    const hl = p.drawLen / 2;
    const box = [{x:-hl,y:-8},{x:hl,y:-8},{x:hl,y:8},{x:-hl,y:8},{x:-hl,y:-8}];
    inkWash(ctx, box, p.id, "#b08a56", .5, 2, 3);
    inkStroke(ctx, box, p.id + ph, { amp:1.3, w:2.6, close:true });
    /* grain lines along the plank */
    for(let i = -2; i <= 2; i++)
      inkStroke(ctx, [{ x:i * hl * .38 - 22, y:0 }, { x:i * hl * .38 + 22, y:0 }],
        p.id + 20 + i + ph, { amp:1, w:1.2 });

function drawTiles(ph){
  for(const t of tiles){
    ctx.save();
    ctx.translate(t.position.x, t.position.y);
    ctx.rotate(t.angle);
    const hw = (t.drawW || 90) / 2, hh = 8;
    const box = [{x:-hw,y:-hh},{x:hw,y:-hh},{x:hw,y:hh},{x:-hw,y:hh},{x:-hw,y:-hh}];
    /* a fusing tile shakes and reddens as its moment runs out */
    const arming = t.fuse > 0;
    if(arming){
      const s = (26 - t.fuse) / 26;
      ctx.translate((Math.random()-.5) * s * 4, (Math.random()-.5) * s * 4);
    }
    inkWash(ctx, box, t.id, arming ? "#b34a32" : "#9c9384", .4, 2, 2);
    inkStroke(ctx, box, t.id + ph, { amp:1.2, w:2.4, close:true,
      col: arming ? "#b34a32" : "#2b2723" });
    inkStroke(ctx, [{x:-hw*.5,y:-hh},{x:-hw*.5,y:hh}], t.id+2+ph, { amp:.8, w:1.2 });
    inkStroke(ctx, [{x: hw*.5,y:-hh},{x: hw*.5,y:hh}], t.id+3+ph, { amp:.8, w:1.2 });
    ctx.restore();
  }
}

function drawAccessory(ph){
  if(wearing === "none") return;
  const R = "#b34a32", B = "#3a5f8a";
  /* cabin roof spans x -8..14, so its centre is x = 3 and its top is y = -36.
     Everything worn on the head is built around that point. */
  const CX = 3, CY = -36;

  if(wearing === "party"){
    const hat = [{x:CX-15,y:CY},{x:CX,y:CY-46},{x:CX+15,y:CY},{x:CX-15,y:CY}];
    inkWash(ctx, hat, 700, R, .45, 2, 2);
    inkStroke(ctx, hat, 700 + ph, { amp:1.3, w:2.4, close:true });
    inkStroke(ctx, circlePts(CX, CY-50, 5, 8), 701 + ph, { amp:1, w:2, close:true, col:R });
    inkStroke(ctx, [{x:CX-10,y:CY-14},{x:CX+10,y:CY-20}], 702 + ph, { amp:1, w:1.4, col:B });
    inkStroke(ctx, [{x:CX-7,y:CY-26},{x:CX+8,y:CY-32}], 703 + ph, { amp:1, w:1.4, col:B });

  } else if(wearing === "cowboy"){
    const brim  = [{x:CX-29,y:CY-2},{x:CX+29,y:CY-2},{x:CX+24,y:CY-10},{x:CX-24,y:CY-10},{x:CX-29,y:CY-2}];
    const crown = [{x:CX-14,y:CY-10},{x:CX-11,y:CY-34},{x:CX+11,y:CY-36},{x:CX+14,y:CY-10}];
    inkWash(ctx, crown, 711, "#8a6a3c", .5, 2, 2);
    inkWash(ctx, brim,  710, "#8a6a3c", .5, 2, 2);
    inkStroke(ctx, crown, 711 + ph, { amp:1.2, w:2.2, close:true });
    inkStroke(ctx, brim,  710 + ph, { amp:1.3, w:2.6, close:true });
    inkStroke(ctx, [{x:CX-13,y:CY-18},{x:CX+13,y:CY-20}], 712 + ph, { amp:1, w:1.8, col:R });

  } else if(wearing === "plough"){
    /* front-mounted, not on the roof */
    const blade = [{x:56,y:14},{x:96,y:-16},{x:104,y:-2},{x:70,y:22},{x:56,y:14}];
    inkWash(ctx, blade, 720, B, .5, 3, 3);
    inkStroke(ctx, blade, 720 + ph, { amp:1.5, w:2.8, close:true });
    inkStroke(ctx, [{x:58,y:6},{x:82,y:-6}], 721 + ph, { amp:1.1, w:1.8 });
    inkStroke(ctx, [{x:60,y:16},{x:96,y:-12}], 722 + ph, { amp:1, w:1.4, col:R });

  } else if(wearing === "antlers"){
    for(const sgn of [-1, 1]){
      const bx = CX + sgn * 9;
      inkStroke(ctx, [{x:bx,y:CY},{x:bx + sgn*11,y:CY-24},{x:bx + sgn*5,y:CY-42}],
        730 + sgn + ph, { amp:1.4, w:2.6, col:"#8a6a3c" });
      inkStroke(ctx, [{x:bx + sgn*8,y:CY-20},{x:bx + sgn*23,y:CY-28}],
        732 + sgn + ph, { amp:1.2, w:2, col:"#8a6a3c" });
      inkStroke(ctx, [{x:bx + sgn*7,y:CY-33},{x:bx + sgn*20,y:CY-43}],
        734 + sgn + ph, { amp:1.2, w:1.8, col:"#8a6a3c" });
    }

  } else if(wearing === "propeller"){
    const cap = [{x:CX-16,y:CY},{x:CX-14,y:CY-14},{x:CX+14,y:CY-14},{x:CX+16,y:CY},{x:CX-16,y:CY}];
    inkWash(ctx, cap, 740, B, .45, 2, 2);
    inkStroke(ctx, cap, 740 + ph, { amp:1.2, w:2.2, close:true });
    inkStroke(ctx, [{x:CX,y:CY-14},{x:CX,y:CY-24}], 741 + ph, { amp:.9, w:1.8 });
    const spin = frame * .35;
    for(let i = 0; i < 2; i++){
      const a = spin + i * Math.PI;
      inkStroke(ctx, [{x:CX,y:CY-26},
                      {x:CX + Math.cos(a)*22, y:CY-26 + Math.sin(a)*6}],
        742 + i + ph, { amp:1, w:2.2, col:R });
    }

  } else if(wearing === "crown"){
    const c = [{x:CX-16,y:CY},{x:CX-14,y:CY-24},{x:CX-7,y:CY-12},{x:CX,y:CY-28},
               {x:CX+7,y:CY-12},{x:CX+14,y:CY-24},{x:CX+16,y:CY},{x:CX-16,y:CY}];
    inkWash(ctx, c, 750, "#c9a227", .5, 2, 2);
    inkStroke(ctx, c, 750 + ph, { amp:1.2, w:2.4, close:true });

  } else if(wearing === "rocket"){
    /* rear-mounted fins */
    const fin = [{x:-56,y:-6},{x:-78,y:-30},{x:-74,y:4},{x:-56,y:-6}];
    inkWash(ctx, fin, 760, R, .5, 2, 2);
    inkStroke(ctx, fin, 760 + ph, { amp:1.3, w:2.4, close:true });
    const fin2 = [{x:-56,y:10},{x:-80,y:22},{x:-58,y:18},{x:-56,y:10}];
    inkWash(ctx, fin2, 761, R, .5, 2, 2);
    inkStroke(ctx, fin2, 761 + ph, { amp:1.3, w:2.2, close:true });
  }
}

function drawGlider(ph){
  if(!gliding) return;
  ctx.save();
  ctx.translate(chassis.position.x, chassis.position.y);
  ctx.rotate(chassis.angle * .5);
  const wing = [{x:-64,y:-52},{x:0,y:-72},{x:64,y:-52},{x:0,y:-44},{x:-64,y:-52}];
  inkWash(ctx, wing, 950, "#3a5f8a", .3, 2, 2);
  inkStroke(ctx, wing, 950 + ph, { amp:1.8, w:2.4, close:true, col:"#3a5f8a" });
  inkStroke(ctx, [{x:0,y:-72},{x:0,y:-44}], 953 + ph, { amp:1.2, w:1.6, col:"#3a5f8a" });
  inkStroke(ctx, [{x:-30,y:-50},{x:-14,y:-38}], 954 + ph, { amp:1, w:1.4, col:"#3a5f8a" });
  inkStroke(ctx, [{x: 30,y:-50},{x: 14,y:-38}], 955 + ph, { amp:1, w:1.4, col:"#3a5f8a" });
  ctx.restore();
}

function drawSpeedTrail(ph){
  if(Math.hypot(chassis.velocity.x, chassis.velocity.y) < TOP_SPEED * .72) return;
  ctx.save();
  ctx.translate(chassis.position.x, chassis.position.y);
  ctx.rotate(chassis.angle);
  for(let i = 0; i < 4; i++){
    const y = -14 + i * 11 + (Math.random() - .5) * 3;
    const len = 26 + Math.random() * 34;
    inkStroke(ctx, [{ x:-58, y:y }, { x:-58 - len, y:y }],
      900 + i + ph, { amp:1.6, w:2.2, col:"#b34a32" });
  }
  ctx.restore();
}

function drawFlag(){
  const fy = surfaceYAt(strokes, finishX);
  inkStroke(ctx, [{x:finishX,y:fy+4},{x:finishX,y:fy-96}], 300, { amp:1.4, w:3 });
  const flag = [
    {x:finishX,y:fy-96},{x:finishX+52,y:fy-88},{x:finishX+44,y:fy-70},{x:finishX,y:fy-58},{x:finishX,y:fy-96}
  ];
  inkWash(ctx, flag, 302, "#b34a32", .45, 2, 2);
  inkStroke(ctx, flag, 302, { amp:1.5, w:2.2, close:true });
  ctx.save();
  inkPath(ctx, flag, 302, 1.5); ctx.closePath(); ctx.clip();
  ctx.strokeStyle = "#2b2723"; ctx.globalAlpha = .5; ctx.lineWidth = 1.4;
  ctx.beginPath();
  for(let i = 0; i < 8; i++){
    ctx.moveTo(finishX + i * 8, fy - 100);
    ctx.lineTo(finishX + i * 8 - 22, fy - 50);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
}

function drawDust(){
  for(const d of dust){
    ctx.globalAlpha = d.life * .5;
    inkStroke(ctx, circlePts(d.x, d.y, d.r * (1.4 - d.life * .4), 8),
      d.seed, { amp:1.5, w:1.5, close:true, col:"#8d8168" });
  }
  ctx.globalAlpha = 1;
}

function render(){
  /* The ink boil is charming while things move and reads as a vibration when
     they don't, so it slows right down once the jeep is close to stopped. */
  const moving = Math.hypot(chassis.velocity.x, chassis.velocity.y) > .6;
  if(moving || mode !== "play") inkPhase = Math.floor(frame / 11) * 3;
  const ph = inkPhase;

  drawBackdrop();

  ctx.save();
  ctx.translate(CW/2, CH/2);
  ctx.scale(scale, scale);
  ctx.translate(-camX, -camY);

  drawGround();
  drawFlag();
  drawRocks();
  drawBeams();
  drawBridges(ph);
  drawWalls();
  drawTiles(ph);
  drawLifts(ph);
  drawPlanks(ph);
  drawBlocks(ph);
  drawBoulders(ph);
  drawBarrels(ph);
  drawHammers(ph);
  drawDust();
  if(mode !== "crash" || modeT < 260){ drawSpeedTrail(ph); drawJeep(ph); drawGlider(ph); }

  ctx.restore();

  if(!grain) grain = makeGrain();
  ctx.fillStyle = grain;
  ctx.fillRect(0, 0, CW, CH);

  /* soft edge shadow so it reads as a sheet of paper */
  const vg = ctx.createRadialGradient(CW/2, CH/2, Math.min(CW,CH)*.35, CW/2, CH/2, Math.max(CW,CH)*.72);
  vg.addColorStop(0, "rgba(90,78,58,0)");
  vg.addColorStop(1, "rgba(90,78,58,.2)");
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, CW, CH);

  drawTrack();
}

/* ───────────────────────── loop ───────────────────────── */

let acc = 0, prev = performance.now();
const STEP = 1000 / 60;

function loop(now){
  requestAnimationFrame(loop);
  let dt = now - prev; prev = now;
  if(dt > 120) dt = 120;
  acc += dt;

  let steps = 0;
  while(acc >= STEP && steps < 4){
    if(mode === "play" && !sheet.classList.contains("show")){ drive(); updateObstacles(); }
    Engine.update(engine, STEP);
    checkState(STEP);
    acc -= STEP; steps++;
  }

  for(let i = dust.length - 1; i >= 0; i--){
    const d = dust[i];
    d.x += d.vx; d.y += d.vy; d.vy += .035; d.vx *= .985;
    d.life -= .016;
    if(d.life <= 0) dust.splice(i, 1);
  }

  /* camera leads a little in the direction of travel */
  const lead = Math.max(-140, Math.min(140, chassis.velocity.x * 22));
  camX += ((chassis.position.x + lead) - camX) * .09;
  camY += ((chassis.position.y - 40) - camY) * .05;

  if(mode === "crash"){
    modeT += dt;
    if(modeT > 1400) buildLevel(levelIdx);
  }

  frame++;
  render();
}

/* ───────────────────────── input ───────────────────────── */

/* The game lives in an iframe. Until that frame holds keyboard focus the
   arrow keys go to the page behind it, so grab focus on load and on any
   click, and say so plainly when we don't have it. */
const nag = document.getElementById("focusnag");

function grabFocus(){
  if(card.classList.contains("show")) return;   // let the card keep focus
  if(sheet.classList.contains("show")) return;  // nor while a panel is up
  try { window.focus(); } catch(e){}
  cv.focus({ preventScroll:true });
}
function haveFocus(){
  return document.hasFocus() && document.activeElement !== null;
}
document.addEventListener("pointerdown", grabFocus, true);
document.addEventListener("pointerenter", grabFocus, true);
document.addEventListener("pointermove", grabFocus, { capture:true, passive:true });
window.addEventListener("load", grabFocus);
grabFocus();

setInterval(() => {
  const ok = document.hasFocus();
  nag.classList.toggle("show", !ok);
  if(!ok) keys.left = keys.right = keys.up = keys.down = keys.glide = false;
}, 200);

/* listen on the document too, in case focus lands on a button */
["keydown","keyup"].forEach(type => {
  document.addEventListener(type, e => {
    const down = type === "keydown";
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
    if(e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = down;
    if(e.key === "ArrowLeft"  || e.key === "a" || e.key === "A") keys.left  = down;
    if(e.key === "ArrowUp"    || e.key === "w" || e.key === "W") keys.up    = down;
    if(e.key === "ArrowDown"  || e.key === "s" || e.key === "S") keys.down  = down;
    if(e.key === " " && !card.classList.contains("show")) keys.glide = down;
    if(e.key === "g" || e.key === "G" || e.key === "Shift") keys.glide = down;
    if(!down) return;
    if(e.key === "Escape") closeSheet();
    if((e.key === "r" || e.key === "R") && mode !== "won") buildLevel(levelIdx);
    if((e.key === " " || e.key === "Enter") && card.classList.contains("show")) nextLevel();
  });
});

window.addEventListener("blur", () => {
  keys.left = keys.right = keys.up = keys.down = keys.glide = false;
});

function bindPad(el, k){
  const on  = e => { e.preventDefault(); keys[k] = true;  };
  const off = e => { e.preventDefault(); keys[k] = false; };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointerleave", off);
  el.addEventListener("pointercancel", off);
}
bindPad(document.getElementById("padL"), "left");
bindPad(document.getElementById("padR"), "right");
bindPad(document.getElementById("padU"), "up");
bindPad(document.getElementById("padD"), "down");
bindPad(document.getElementById("padG"), "glide");

/* ───────────────────────── go ───────────────────────── */

resize();
buildLevel(0);
requestAnimationFrame(loop);

})();
</script>
